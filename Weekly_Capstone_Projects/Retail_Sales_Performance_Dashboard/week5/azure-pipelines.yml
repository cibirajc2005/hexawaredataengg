trigger: none

schedules:
- cron: "0 6 * * 1"
  displayName: Weekly Monday Sales Analysis Run
  branches:
    include:
    - main
  always: true

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'
    addToPath: true

- script: |
    pip install pandas numpy
  displayName: 'Install dependencies'

- script: |
    python generate_weekly_sales_report.py
  displayName: 'Run weekly sales insights report'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'weekly_sales_report.csv'
    ArtifactName: 'SalesReport'
    publishLocation: 'Container'
